<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, World</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      color: #1a1a2e;
      border-radius: 16px;
      padding: 2.5rem;
      width: min(90vw, 420px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.8rem;
    }
    p {
      margin: 0 0 1.5rem;
      opacity: 0.7;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      border: 2px solid #ddd;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #667eea;
    }
    button {
      margin-top: 1rem;
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #667eea;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:hover {
      background: #5a6fd8;
    }
    button:active {
      transform: scale(0.98);
    }
    .greeting {
      margin-top: 1.5rem;
      min-height: 1.5em;
      font-size: 1.4rem;
      font-weight: 700;
      color: #667eea;
    }
    @media (prefers-color-scheme: dark) {
      .card {
        background: rgba(30, 30, 50, 0.95);
        color: #eee;
      }
      input {
        background: #1f1f35;
        color: #eee;
        border-color: #3a3a5c;
      }
      input:focus {
        border-color: #8b9bff;
      }
      .greeting {
        color: #8b9bff;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello, World</h1>
    <p>What's your name?</p>
    <input id="name" type="text" placeholder="Type your name" autocomplete="off">
    <button id="greet">Say hello</button>
    <div id="greeting" class="greeting"></div>
  </main>
  <script>
    const input = document.getElementById('name');
    const button = document.getElementById('greet');
    const greeting = document.getElementById('greeting');

    function greet() {
      const name = input.value.trim();
      greeting.textContent = name ? 'Hello, ' + name + '!' : 'Please tell me your name first.';
    }

    button.addEventListener('click', greet);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') greet();
    });
  </script>
</body>
</html>
